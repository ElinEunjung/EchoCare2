# Configuration for Gateway Service (Docker Profile)
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods: '*'
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth endpoints (public - no JWT needed for registration and login)
        - id: auth-route
          uri: lb://profile-service
          predicates:
            - Path=/api/auth/**

        # Caregiver endpoints (public - no JWT needed)
        - id: caregiver-route
          uri: lb://profile-service
          predicates:
            - Path=/api/caregivers/**

        # Profile Service (requires JWT)
        - id: profile-route
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthenticationFilter

        # Playlist Service (requires JWT)
        - id: playlist-route
          uri: lb://playlist-service
          predicates:
            - Path=/api/playlists/**
          filters:
            - JwtAuthenticationFilter

        # Feedback Service (requires JWT)
        - id: feedback-route
          uri: lb://feedback-service
          predicates:
            - Path=/api/feedback/**
          filters:
            - JwtAuthenticationFilter

        # Health check routes (public access for monitoring)
        - id: profile-actuator
          uri: lb://profile-service
          predicates:
            - Path=/services/profile/actuator/**
          filters:
            - RewritePath=/services/profile/actuator/(?<segment>.*), /actuator/$\{segment}

        - id: playlist-actuator
          uri: lb://playlist-service
          predicates:
            - Path=/services/playlist/actuator/**
          filters:
            - RewritePath=/services/playlist/actuator/(?<segment>.*), /actuator/$\{segment}

        - id: feedback-actuator
          uri: lb://feedback-service
          predicates:
            - Path=/services/feedback/actuator/**
          filters:
            - RewritePath=/services/feedback/actuator/(?<segment>.*), /actuator/$\{segment}

server:
  port: 8080

info:
  app:
    name: Gateway Service
    description: API Gateway for EchoCare microservices
    version: 1.0.0

