# ======================================================================
# SHARED CONFIGURATION FOR ALL MICROSERVICES
# This file is served by Config Server to ALL services
# Service-specific configs (profile-service.yml, etc.) override these
# ======================================================================

# Common configuration for ALL services
spring:
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        fail-fast: false # allows service to start without Consul
        health-check-interval: 10s
        health-check-timeout: 5s
        instance-id: ${spring.application.name}-${INSTANCE_ID:default}
        prefer-ip-address: false
        hostname: ${spring.application.name}
      config:
        enabled: false # disable Consul config (I use Config Server)
    loadbalancer:
      cache:
        enabled: false  # Disable caching for real-time load balancing
      ribbon:
        enabled: false  # Use Spring Cloud LoadBalancer instead of Ribbon
  rabbitmq:
    # host and port are set via environment variables (RABBITMQ_HOST, RABBITMQ_PORT)
    # Do NOT hardcode localhost here - it breaks Docker networking
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # Shows details only for authorized users (MVP-friendly)
      show-components: when-authorized
  health:
    defaults:
      enabled: true
    db:
      enabled: true  # Database health check (services without DB override this)
    rabbit:
      enabled: true  # RabbitMQ health check (services without RabbitMQ override this)

logging:
  level:
    org.hibernate.SQL: DEBUG
    no.kristiania.echocare: DEBUG
    org.springframework.boot.actuate: DEBUG

