services:
  # ===== CONSUL (Service Discovery) =====

  consul:
    image: consul:1.15
    container_name: echocare-consul
    ports:
      - "8500:8500"  # Consul UI and API
      - "8600:8600/udp"  # Consul DNS
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ===== CONFIG SERVER =====

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: echocare-config-server
    ports:
      - "8888:8888"
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ===== DATABASES =====

  profile-db:
    image: postgres:15-alpine
    container_name: echocare-profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_pass
    ports:
      - "5435:5432" # Host port 5435 → Container port 5432
    volumes:
      - profile-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 10s # Check every 10 seconds
      timeout: 5s   # Wait max 5 seconds
      retries: 5    # Try 5 times

  playlist-db:
    image: postgres:15-alpine
    container_name: echocare-playlist-db
    environment:
      POSTGRES_DB: playlist_db
      POSTGRES_USER: playlist_user
      POSTGRES_PASSWORD: playlist_pass
    ports:
      - "5433:5432" # Host port 5433 → Container port 5432
    volumes:
      - playlist-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlist_user -d playlist_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  feedback-db:
    image: postgres:15-alpine
    container_name: echocare-feedback-db
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_pass
    ports:
      - "5434:5432"   # Host port 5434 → Container port 5432
    volumes:
      - feedback-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d feedback_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== PROFILE SERVICE (2 INSTANCES) =====

  profile-service-1:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: profile-service-1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-profile-db:5432/profile_db
      SPRING_DATASOURCE_USERNAME: profile_user
      SPRING_DATASOURCE_PASSWORD: profile_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: profile-1
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      profile-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - profile-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  profile-service-2:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: profile-service-2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-profile-db:5432/profile_db
      SPRING_DATASOURCE_USERNAME: profile_user
      SPRING_DATASOURCE_PASSWORD: profile_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: profile-2
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      profile-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - profile-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ===== PLAYLIST SERVICE (2 INSTANCES) =====

  playlist-service-1:
    build:
      context: ./services/playlist-service
      dockerfile: Dockerfile
    container_name: playlist-service-1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-playlist-db:5432/playlist_db
      SPRING_DATASOURCE_USERNAME: playlist_user
      SPRING_DATASOURCE_PASSWORD: playlist_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: playlist-1
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      playlist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - playlist-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  playlist-service-2:
    build:
      context: ./services/playlist-service
      dockerfile: Dockerfile
    container_name: playlist-service-2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-playlist-db:5432/playlist_db
      SPRING_DATASOURCE_USERNAME: playlist_user
      SPRING_DATASOURCE_PASSWORD: playlist_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: playlist-2
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      playlist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - playlist-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ===== FEEDBACK SERVICE (2 INSTANCES) =====

  feedback-service-1:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile
    container_name: feedback-service-1
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-feedback-db:5432/feedback_db
      SPRING_DATASOURCE_USERNAME: feedback_user
      SPRING_DATASOURCE_PASSWORD: feedback_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: feedback-1
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      feedback-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - feedback-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  feedback-service-2:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile
    container_name: feedback-service-2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-feedback-db:5432/feedback_db
      SPRING_DATASOURCE_USERNAME: feedback_user
      SPRING_DATASOURCE_PASSWORD: feedback_pass
      SPRING_RABBITMQ_HOST: echocare-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      INSTANCE_ID: feedback-2
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      feedback-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      echocare-network:
        aliases:
          - feedback-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ===== API GATEWAY (SINGLE ENTRY POINT) =====

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: echocare-gateway
    ports:
      - "8080:8080"  # ONLY THIS PORT IS EXPOSED!
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://echocare-config-server:8888
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      # Dev-only default for local demo. Override via environment in any real deployment.
      JWT_SECRET: WOwTER+0vZAxLEr3LtLzJY1Y77gWWnnuQeUrvvTA9ZKvH47wGBwv1kJ+ghqrn7basSlRTQjjXNsaMJdZNbQRIw==
    depends_on:
      consul:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-service-1:
        condition: service_started
      profile-service-2:
        condition: service_started
      playlist-service-1:
        condition: service_started
      playlist-service-2:
        condition: service_started
      feedback-service-1:
        condition: service_started
      feedback-service-2:
        condition: service_started
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===== RABBITMQ =====

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: echocare-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s # RabbitMQ needs more time to start
    networks:
      - echocare-network

volumes:
  profile-data:
  playlist-data:
  feedback-data:
  rabbitmq-data:
  rabbitmq-logs:

networks:
  echocare-network:
    driver: bridge
