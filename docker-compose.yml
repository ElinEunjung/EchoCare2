services:
  # PostgreSQL for Profile Service
  profile-db:
    image: postgres:15-alpine
    container_name: echocare-profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_pass
    ports:
      - "5435:5432"  # Changed from 5432 to avoid conflict with local PostgreSQL
    volumes:
      - profile-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Playlist Service
  playlist-db:
    image: postgres:15-alpine
    container_name: echocare-playlist-db
    environment:
      POSTGRES_DB: playlist_db
      POSTGRES_USER: playlist_user
      POSTGRES_PASSWORD: playlist_pass
    ports:
      - "5433:5432"  # Different host port!
    volumes:
      - playlist-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlist_user -d playlist_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Feedback Service
  feedback-db:
    image: postgres:15-alpine
    container_name: echocare-feedback-db
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_pass
    ports:
      - "5434:5432"  # Different host port!
    volumes:
      - feedback-data:/var/lib/postgresql/data
    networks:
      - echocare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d feedback_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Profile Service
  profile-service:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: profile-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-profile-db:5432/profile_db
      SPRING_DATASOURCE_USERNAME: profile_user
      SPRING_DATASOURCE_PASSWORD: profile_pass
      RABBITMQ_HOST: echocare-rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      profile-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - echocare-network
    restart: unless-stopped

  # Playlist Service
  playlist-service:
    build:
      context: ./services/playlist-service
      dockerfile: Dockerfile
    container_name: playlist-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-playlist-db:5432/playlist_db
      SPRING_DATASOURCE_USERNAME: playlist_user
      SPRING_DATASOURCE_PASSWORD: playlist_pass
      RABBITMQ_HOST: echocare-rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      playlist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - echocare-network
    restart: unless-stopped

  # Feedback Service
  feedback-service:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile
    container_name: feedback-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://echocare-feedback-db:5432/feedback_db
      SPRING_DATASOURCE_USERNAME: feedback_user
      SPRING_DATASOURCE_PASSWORD: feedback_pass
      RABBITMQ_HOST: echocare-rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      feedback-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - echocare-network
    restart: unless-stopped

  # API Gateway
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: echocare-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: WOwTER+0vZAxLEr3LtLzJY1Y77gWWnnuQeUrvvTA9ZKvH47wGBwv1kJ+ghqrn7basSlRTQjjXNsaMJdZNbQRIw==
    depends_on:
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_started
      playlist-service:
        condition: service_started
      feedback-service:
        condition: service_started
    networks:
      - echocare-network
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: echocare-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port (for services to connect)
      - "15672:15672" # Management UI (for monitoring)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - echocare-network

volumes:
  profile-data:
  playlist-data:
  feedback-data:
  rabbitmq-data:
  rabbitmq-logs:

networks:
  echocare-network:
    driver: bridge
