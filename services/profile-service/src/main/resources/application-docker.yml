spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://echocare-profile-db:5432/profile_db
    username: profile_user
    password: profile_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Changed from 'update' to 'validate' - Flyway manages schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true # For existing databases
    locations: classpath:db/migration
    validate-on-migrate: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# Custom properties for exchanges and routing keys
# Note: Profile Service is a PUBLISHER only - it does not create queues
# Consumers (like playlist-service) create their own queues and bind to this exchange
rabbitmq:
  exchange:
    profile: profile.exchange
  routing-key:
    profile-created: profile.created
    profile-updated: profile.updated

server:
  port: 8081

# JWT Configuration (if using Spring Security)
jwt:
  secret: WOwTER+0vZAxLEr3LtLzJY1Y77gWWnnuQeUrvvTA9ZKvH47wGBwv1kJ+ghqrn7basSlRTQjjXNsaMJdZNbQRIw==

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
  defaults:
    enabled: true

info:
  app:
    name: Profile Service
    description: Manages patient profiles and caregivers
    version: 1.0.0

  logging:
  level:
    org.springframework.boot.actuate: DEBUG

