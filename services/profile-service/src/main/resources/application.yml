spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://localhost:5435/profile_db
    username: profile_user
    password: profile_pass
    driver-class-name: org.postgresql.Driver
  jpa:
   hibernate:
     ddl-auto: create-drop  # Change to 'update' for production
   show-sql: true

   properties:
     hibernate:
       dialect: org.hibernate.dialect.PostgreSQLDialect
       format_sql: true

   defer-datasource-initialization: true
  sql:
    init:
      mode: never  # Disable initialization scripts since test-data.sql is empty
      continue-on-error: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

# Custom properties for exchanges and queues
rabbitmq:
  exchange:
    profile: profile.exchange
  queue:
    profile-created: profile.created.queue
    profile-updated: profile.updated.queue
  routing-key:
    profile-created: profile.created
    profile-updated: profile.updated

server:
  port: 8081

