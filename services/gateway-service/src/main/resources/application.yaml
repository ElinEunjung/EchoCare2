spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # Auth endpoints (public - no JWT needed for registration and login)
        - id: auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Caregiver endpoints (public - no JWT needed)
        - id: caregiver-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/caregivers/**

        # Profile Service (requires JWT)
        - id: profile-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthenticationFilter

        # Playlist Service (requires JWT)
        - id: playlist-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/playlists/**
          filters:
            - JwtAuthenticationFilter

        # Feedback Service (requires JWT)
        - id: feedback-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/feedback/**
          filters:
            - JwtAuthenticationFilter

jwt:
  secret: WOwTER+0vZAxLEr3LtLzJY1Y77gWWnnuQeUrvvTA9ZKvH47wGBwv1kJ+ghqrn7basSlRTQjjXNsaMJdZNbQRIw==

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    no.kristiania.echocare: DEBUG

management:
