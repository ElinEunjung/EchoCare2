spring:
  config:
    import: "optional:configserver:http://echocare-config-server:8888"
  application:
    name: gateway-service
  cloud:
    config:
      fail-fast: false # Don't fail if Config Server is down
      retry:
        max-attempts: 3
        initial-interval: 1000
    loadbalancer:
      cache:
        enabled: false  # Disable caching to see load balancing in real-time
      ribbon:
        enabled: false  # Use Spring Cloud LoadBalancer, not Ribbon
      consul:
        enabled: true  # Enable Consul-based service discovery for load balancing

