spring:
  application:
    name: playlist-service

  datasource:
    url: jdbc:postgresql://localhost:5433/playlist_db
    username: playlist_user
    password: playlist_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always  # Changed from 'always' to 'never' - data persists in DB, only seed once manually if needed
      data-locations: classpath:test-data.sql

  rabbitmq:
    enabled: true  # Set to false to run without RabbitMQ (sync-only mode)
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

rabbitmq:
  exchange:
    profile: profile.exchange # Subscribes to profile events
    feedback: feedback.exchange # Subscribes to feedback events
  queue:
    profile-events: playlist.profile-events.queue # Own queue for profile events
    feedback-events: playlist.feedback-events.queue # Own queue for feedback events
  routing-key:
    profile-created: profile.created
    profile-updated: profile.updated
    feedback-submitted: feedback.submitted


server:
  port: 8082


# Profile Service URL (used for fetching user profiles)
services:
  profile:
    url: http://localhost:8081

logging:
  level:
    org.hibernate.SQL: DEBUG
    no.kristiania.echocare: DEBUG

