spring:
  application:
    name: playlist-service

  datasource:
    url: jdbc:postgresql://localhost:5433/playlist_db
    username: playlist_user
    password: playlist_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:test-data.sql

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

rabbitmq:
  exchange:
    profile: profile.exchange
    feedback: feedback.exchange
  queue:
    profile-events: playlist.profile-events.queue
    feedback-events: playlist.feedback-events.queue
  routing-key:
    profile-created: profile.created
    profile-updated: profile.updated
    feedback-submitted: feedback.submitted

server:
  port: 8082
  servlet:
    context-path: /playlist

logging:
  level:
    org.hibernate.SQL: DEBUG
    no.kristiania.echocare: DEBUG

