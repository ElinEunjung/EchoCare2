spring:
  application:
    name: playlist-service
  cloud:
    config:
      uri: http://echocare-config-server:8888

  datasource:
    url: jdbc:postgresql://echocare-playlist-db:5432/playlist_db
    username: playlist_user
    password: playlist_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Changed from 'update' to 'validate' - Flyway manages schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  sql:
    init:
      mode: never  # Disabled - Flyway manages all database initialization

  flyway:
    enabled: true
    baseline-on-migrate: true  # For existing databases
    locations: classpath:db/migration
    validate-on-migrate: true

  rabbitmq:
    host: echocare-rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

rabbitmq:
  exchange:
    profile: profile.exchange
    feedback: feedback.exchange
  queue:
    profile-events: playlist.profile-events.queue
    feedback-events: playlist.feedback-events.queue
  routing-key:
    profile-created: profile.created
    profile-updated: profile.updated
    feedback-submitted: feedback.submitted

server:
  port: 8082

# Profile Service URL (used for fetching user profiles)
services:
  profile:
    url: http://profile-service:8081


jwt:
  secret: WOwTER+0vZAxLEr3LtLzJY1Y77gWWnnuQeUrvvTA9ZKvH47wGBwv1kJ+ghqrn7basSlRTQjjXNsaMJdZNbQRIw==

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true
info:
  app:
    name: Playlist Service
    description: Generates personalized music playlists
    version: 1.0.0

logging:
  level:
    org.hibernate.SQL: DEBUG
    no.kristiania.echocare: DEBUG
    org.springframework.boot.actuate: DEBUG
